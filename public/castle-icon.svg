<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Castle Pixel Art Icon -->
  <!-- Sky background -->
  <rect width="32" height="32" fill="#1a1a2e"/>
  
  <!-- Stars -->
  <rect x="3" y="2" width="1" height="1" fill="#ffffff" opacity="0.6"/>
  <rect x="12" y="1" width="1" height="1" fill="#ffffff" opacity="0.4"/>
  <rect x="27" y="3" width="1" height="1" fill="#ffffff" opacity="0.7"/>
  <rect x="22" y="1" width="1" height="1" fill="#ffffff" opacity="0.5"/>
  
  <!-- Left tower -->
  <rect x="4" y="8" width="6" height="20" fill="#4a4a6a"/>
  <rect x="4" y="8" width="1" height="1" fill="#6a6a8a"/>
  <rect x="6" y="8" width="1" height="1" fill="#6a6a8a"/>
  <rect x="9" y="8" width="1" height="1" fill="#6a6a8a"/>
  <!-- Left tower top -->
  <rect x="3" y="6" width="8" height="2" fill="#5a5a7a"/>
  <rect x="4" y="5" width="6" height="1" fill="#5a5a7a"/>
  <rect x="5" y="4" width="4" height="1" fill="#6a6a8a"/>
  <rect x="6" y="3" width="2" height="1" fill="#7a7a9a"/>
  <!-- Left tower window -->
  <rect x="6" y="12" width="2" height="3" fill="#00ccff"/>
  <rect x="6" y="12" width="1" height="1" fill="#00eeff"/>
  
  <!-- Center tower (tallest) -->
  <rect x="12" y="6" width="8" height="22" fill="#5a5a7a"/>
  <rect x="12" y="6" width="1" height="1" fill="#7a7a9a"/>
  <rect x="15" y="6" width="2" height="1" fill="#7a7a9a"/>
  <rect x="19" y="6" width="1" height="1" fill="#7a7a9a"/>
  <!-- Center tower top -->
  <rect x="11" y="4" width="10" height="2" fill="#6a6a8a"/>
  <rect x="12" y="3" width="8" height="1" fill="#6a6a8a"/>
  <rect x="13" y="2" width="6" height="1" fill="#7a7a9a"/>
  <rect x="14" y="1" width="4" height="1" fill="#8a8aaa"/>
  <rect x="15" y="0" width="2" height="1" fill="#9a9aba"/>
  <!-- Center tower windows -->
  <rect x="14" y="10" width="4" height="4" fill="#00ccff"/>
  <rect x="14" y="10" width="2" height="2" fill="#00eeff"/>
  <rect x="15" y="18" width="2" height="2" fill="#00ccff"/>
  
  <!-- Right tower -->
  <rect x="22" y="8" width="6" height="20" fill="#4a4a6a"/>
  <rect x="22" y="8" width="1" height="1" fill="#6a6a8a"/>
  <rect x="24" y="8" width="1" height="1" fill="#6a6a8a"/>
  <rect x="27" y="8" width="1" height="1" fill="#6a6a8a"/>
  <!-- Right tower top -->
  <rect x="21" y="6" width="8" height="2" fill="#5a5a7a"/>
  <rect x="22" y="5" width="6" height="1" fill="#5a5a7a"/>
  <rect x="23" y="4" width="4" height="1" fill="#6a6a8a"/>
  <rect x="24" y="3" width="2" height="1" fill="#7a7a9a"/>
  <!-- Right tower window -->
  <rect x="24" y="12" width="2" height="3" fill="#00ccff"/>
  <rect x="25" y="12" width="1" height="1" fill="#00eeff"/>
  
  <!-- Castle wall -->
  <rect x="10" y="14" width="12" height="14" fill="#4a4a6a"/>
  <!-- Wall battlements -->
  <rect x="10" y="13" width="2" height="1" fill="#5a5a7a"/>
  <rect x="14" y="13" width="2" height="1" fill="#5a5a7a"/>
  <rect x="18" y="13" width="2" height="1" fill="#5a5a7a"/>
  
  <!-- Gate -->
  <rect x="14" y="22" width="4" height="6" fill="#1a1a2e"/>
  <rect x="14" y="21" width="4" height="1" fill="#3a3a5a"/>
  <rect x="15" y="21" width="2" height="1" fill="#3a3a5a"/>
  
  <!-- Ground -->
  <rect x="0" y="28" width="32" height="4" fill="#2a3a2a"/>
  <rect x="2" y="27" width="2" height="1" fill="#3a4a3a"/>
  <rect x="28" y="27" width="2" height="1" fill="#3a4a3a"/>
  
  <!-- Flag on center tower -->
  <rect x="15" y="0" width="1" height="1" fill="#aa55ff"/>
  <rect x="16" y="0" width="2" height="1" fill="#ff5555"/>
</svg>
